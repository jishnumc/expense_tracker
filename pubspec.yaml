name: expense_tracker
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  sqflite: ^2.4.2+1
  flutter_local_notifications: ^21.0.0
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  pinput: ^6.0.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  collection: ^1.19.1
  path: ^1.9.1
  path_provider: ^2.1.5
  get_it: ^8.2.0
  equatable: ^2.0.7
  chopper: ^8.4.0
  uuid: ^4.5.1
  flutter_bloc: ^9.1.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  chopper_generator: ^8.4.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/png/
    - assets/svg/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        # - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 400
